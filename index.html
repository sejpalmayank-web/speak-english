<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#6366f1">
    <title>FluencyCoach - Free English Speaking Practice</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HOME SCREEN -->
    <div id="home-screen" class="screen active">
        <header class="app-header">
            <h1>🎯 FluencyCoach</h1>
            <p>Free AI English Tutor for Work & Life</p>
        </header>
        
        <div class="stats-bar">
            <div class="stat">
                <span id="streak-count">0</span>
                <small>Day Streak</small>
            </div>
            <div class="stat">
                <span id="session-count">0</span>
                <small>Sessions</small>
            </div>
        </div>
        
        <h2 class="section-title">Choose a Scenario</h2>
        <div id="scenario-grid" class="scenario-grid"></div>
        
        <div class="tip-box">
            <strong>💡 Pro Tip:</strong> Practice one scenario daily for 10 minutes. Consistency beats intensity!
        </div>
    </div>

    <!-- PRACTICE SCREEN -->
    <div id="practice-screen" class="screen">
        <div class="practice-header">
            <button onclick="showScreen('home-screen')" class="btn-back">←</button>
            <div>
                <span id="scenario-icon" class="header-icon">📊</span>
                <h2 id="scenario-title">Daily Standup</h2>
            </div>
            <div class="turn-counter"><span id="turn-num">1</span>/10</div>
        </div>
        
        <div class="ai-area">
            <div class="ai-avatar">🤖</div>
            <div id="ai-message" class="ai-message">Loading...</div>
        </div>
        
        <div id="chat-history" class="chat-history"></div>
        
        <div class="user-area">
            <div id="user-text" class="user-text">Tap mic and speak...</div>
            <button id="mic-btn" class="mic-btn" onclick="toggleListening()">
                🎤 Tap to Speak
            </button>
        </div>
        
        <div id="feedback-panel" class="feedback-panel"></div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div id="summary-screen" class="screen">
        <div id="session-summary" class="summary-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
